name: Windows Overlay

on:
  push:
    paths: &overlay-paths
      - "src/autoscrapper/overlay*.py"
      - "src/autoscrapper/interaction/**"
      - "src/autoscrapper/scanner/**"
      - "src/autoscrapper/tui/scan.py"
      - "src/autoscrapper/tui/settings.py"
      - "src/autoscrapper/config.py"
      - "tests/test_overlay*.py"
      - "pyproject.toml"
      - ".github/workflows/overlay.yml"
  pull_request:
    paths: *overlay-paths

permissions:
  contents: read

jobs:
  overlay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_overlay*.py" -v
