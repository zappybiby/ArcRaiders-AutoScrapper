name: Windows setup path fix check

on:
  push:
    branches: [codex/windows-setup-check-20261015]
    paths: [.github/workflows/setup-windows-check.yml]

permissions:
  contents: read

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8ac474558e832aeabe233dcf2c77421b5270f8c9
      - name: Run documented setup and use uv in the same PowerShell session
        run: |
          $ErrorActionPreference = 'Stop'
          $uvDirs = @(Get-Command uv -CommandType Application -All -ErrorAction SilentlyContinue | ForEach-Object { Split-Path $_.Path })
          $env:Path = ($env:Path -split ';' | Where-Object { $_.TrimEnd('\') -notin $uvDirs }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw 'Fresh-install test still finds uv' }

          $global:setupPromptCount = 0
          function global:Read-Host {
            param([string]$Prompt)
            $global:setupPromptCount++
            return 'y'
          }

          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          .\scripts\setup-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Fresh setup exited $LASTEXITCODE" }
          if ($global:setupPromptCount -ne 4) { throw "Expected four fresh-setup prompts, got $global:setupPromptCount" }
          $expectedUv = Join-Path $HOME '.local\bin\uv.exe'
          $resolvedUv = (Get-Command uv -CommandType Application -ErrorAction Stop).Path
          if ($resolvedUv -ne $expectedUv) { throw "Unexpected uv after setup: $resolvedUv" }
          uv --version
          if ($LASTEXITCODE -ne 0) { throw 'Bare uv command failed after setup' }
          uv run python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 14)"
          if ($LASTEXITCODE -ne 0) { throw 'Bare uv run failed after setup' }

          $global:setupPromptCount = 0
          .\scripts\setup-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Setup rerun exited $LASTEXITCODE" }
          if ($global:setupPromptCount -ne 3) { throw "Expected three rerun prompts, got $global:setupPromptCount" }
          if ((Get-Command uv -CommandType Application -ErrorAction Stop).Path -ne $resolvedUv) { throw 'Setup rerun changed uv selection' }
          uv --version
          if ($LASTEXITCODE -ne 0) { throw 'Bare uv command failed after setup rerun' }
          Remove-Item Function:\Read-Host
          "${{ matrix.shell }}: fresh setup, immediate uv use, and existing-uv rerun passed." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - uses: actions/checkout@v7
        with:
          ref: 3fcb16bb696041e1afeb316bf289f2e1168b57f7
          path: literal-path-case
      - name: Detect uv.exe in a directory containing brackets and spaces
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'uv literal [test] folder'
          New-Item -ItemType Directory -Path $fixtureDir -Force | Out-Null
          $candidate = Join-Path $fixtureDir 'uv.exe'
          Set-Content -LiteralPath $candidate -Value 'Test-Path fixture' -Encoding Ascii
          if (Test-Path -Path $candidate -PathType Leaf) { throw 'Original wildcard check unexpectedly found the bracketed path' }
          $source = Get-Content -LiteralPath 'literal-path-case/scripts/setup-windows.ps1' -Raw
          $condition = [regex]::Match($source, 'if \((Test-Path [^\r\n]+ \$candidate [^\r\n]+)\)')
          if (-not $condition.Success) { throw 'Could not locate the uv candidate check in the setup script' }
          if (-not (& ([scriptblock]::Create($condition.Groups[1].Value)))) { throw 'Updated setup check missed uv.exe in a bracketed path' }
          "${{ matrix.shell }}: original wildcard check failed and updated script condition found the same bracketed path." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
