[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscrapper"
version = "0.1.0"
description = "Arc Raiders inventory autoscrapper"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mss>=10.0",
    "numpy>=2.3.2",
    "opencv-python>=4.13.0.92",
    "Pillow>=12.0.0",
    "pydirectinput-rgx>=2.1.3; sys_platform == 'win32'",
    "pynput>=1.8.1; sys_platform == 'linux'",
    "PySide6-Essentials>=6.12.0; sys_platform == 'win32'",
    "pywinctl>=0.4",
    "rich>=13.3.3",
    "textual>=6.0.0",
    "tessdata.fast-eng>=1.0.0",
    "tesserocr>=2.9.1; sys_platform == 'linux'",
    "tesserocr @ https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.11.0-tesseract-5.5.3/tesserocr-2.11.0-cp314-cp314-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.14' and platform_machine == 'AMD64'",
]

[project.optional-dependencies]
dev = [
    "black==26.1.0",
    "pre-commit",
]

[project.scripts]
autoscrapper = "autoscrapper.__main__:main"

[project.urls]
Homepage = "https://github.com/zappybiby/ArcRaiders-AutoScrapper"

[tool.uv]
required-version = ">=0.9.8"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoscrapper = [
    "items/items_rules.default.json",
    "progress/data/*.json",
    "progress/data/static/*.json",
    "tui/*.tcss",
]

[tool.black]
extend-exclude = '''
^scripts/(setup-linux\.sh|setup-windows\.ps1)$
'''
